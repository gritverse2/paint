<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inpainter Clone</title>
    <style>
        body { margin: 0; overflow: hidden; }
        .iframe-container {
            width: 100vw;
            height: 60vh; /* Ajustează înălțimea ca să ascunzi partea de jos */
            overflow: hidden;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%; /* Mărește înălțimea iframe-ului ca să ascunzi partea de jos */
            border: none;
            position: absolute;
            top: 0vh; /* Ajustează pentru a ascunde textul */
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://inpainter.vercel.app/paint"></iframe>
    </div>
</body>
</html>
