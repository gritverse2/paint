<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Chat - No Sidebar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe id="chatFrame" src="https://web.chai-research.com/chat/_bot_be535a9d-3042-4066-a80b-966d3824e43a_ZfFDV2CqVXMw1E7OSxpsuQwDm3v2_1739365607617?is_new=true"></iframe>
    </div>

    <script>
        document.getElementById("chatFrame").onload = function() {
            let iframe = document.getElementById("chatFrame").contentWindow.document;

            // Ascundem meniul lateral și banner-ul "GET 3 DAYS ULTRA FREE"
            setTimeout(() => {
                let sidebar = iframe.querySelector(".sidebar-class"); // Înlocuiește cu clasa exactă a meniului
                let banner = iframe.querySelector(".header-banner-class"); // Înlocuiește cu clasa bannerului

                if (sidebar) sidebar.style.display = "none";
                if (banner) banner.style.display = "none";
            }, 2000); // Dăm timp paginii să se încarce
        };
    </script>
</body>
</html>
