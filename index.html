<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inpainter Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .iframe-container {
            width: 100vw;
            height: 90vh; /* Ajustează înălțimea astfel încât să fie vizibil doar ce vrei */
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 110%; /* Ușor mai mare ca să ascundem partea de jos */
            border: none;
            position: absolute;
            top: 0; /* Nu mai mutăm iframe-ul în sus */
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px; /* Ascunde doar partea de jos */
            background: white; /* Sau culoarea de fundal a paginii */
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://inpainter.vercel.app/paint"></iframe>
        <div class="overlay"></div> <!-- Acoperă doar partea inferioară -->
    </div>
</body>
</html>
