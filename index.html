<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Chat - No Sidebar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe id="chatFrame" src="https://web.chai-research.com/chat/_bot_be535a9d-3042-4066-a80b-966d3824e43a_ZfFDV2CqVXMw1E7OSxpsuQwDm3v2_1739365607617?is_new=true"></iframe>
    </div>

    <script>
        document.getElementById("chatFrame").onload = function() {
            let iframeDoc = document.getElementById("chatFrame").contentWindow.document;

            setTimeout(() => {
                // Lista elementelor de șters
                let selectorsToRemove = [
                    "span.absolute.left-1\\/2.top-1\\/2", // Element ascuns
                    "div.cursor-default strong.font-bold.text-chai-red-500", // Header "GET 3 DAYS ULTRA FREE"
                    "img[alt='CHAI WEB | Logo']", // Logo Chai Web
                    "button[aria-label='CHAI WEB | Share Button']", // Buton Subscribe
                    "button[aria-label='CHAI WEB | Sign Out Button']" // Buton Sign Out
                ];

                // Parcurgem lista și ștergem elementele
                selectorsToRemove.forEach(selector => {
                    let elements = iframeDoc.querySelectorAll(selector);
                    elements.forEach(el => el.style.display = "none");
                });

            }, 3000); // Dăm timp paginii să se încarce complet
        };
    </script>
</body>
</html>
