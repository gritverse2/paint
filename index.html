<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inpainting Clone</title>
    <link rel="stylesheet" href="https://inpainter.vercel.app/_next/static/css/994a46313e567097.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 1024px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .hidden {
            display: none !important; /* Ascunde butoanele API */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Inpainting with Ideogram v2</h2>
        <form class="py-5">
            <div class="flex">
                <input type="text" name="prompt" placeholder="Enter a prompt..." value="painting of fruit on a table" style="width: 70%; padding: 8px;">
                <select name="model" style="padding: 8px;">
                    <option value="ideogram-ai/ideogram-v2-turbo">Ideogram v2 Turbo (Fast)</option>
                    <option value="ideogram-ai/ideogram-v2">Ideogram v2 (High Quality)</option>
                </select>
                <button type="submit" style="padding: 8px 12px; background: black; color: white; border: none; cursor: pointer;">Generate</button>
            </div>
        </form>
        <div class="canvas-container" style="background: gray; width: 100%; height: 400px;"></div>
    </div>

    <script>
        // Elimină butoanele API dacă există
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll(".lil-button").forEach(button => button.classList.add("hidden"));
        });
    </script>
</body>
</html>
