<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Chat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .iframe-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 110%;
            border: none;
            position: absolute;
            top: -50px; /* Ajustează ca să ascunzi header-ul */
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px; /* Ascunde header-ul */
            background: white;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://web.chai-research.com/chat/_bot_be535a9d-3042-4066-a80b-966d3824e43a_ZfFDV2CqVXMw1E7OSxpsuQwDm3v2_1739365607617?is_new=true"></iframe>
        <div class="overlay"></div> <!-- Acoperă partea de sus -->
    </div>
</body>
</html>
